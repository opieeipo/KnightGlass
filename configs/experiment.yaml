# KnightGlass experiment configuration.
# Values are the provisional defaults from the README. Change them only with
# training/validation evidence, and record every change.

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  files:
    auth: auth.txt.gz
    dns: dns.txt.gz
    redteam: redteam.txt.gz
  # Google Drive file IDs for gdown (files shared as "Anyone with the link").
  drive_ids:
    auth: "1PjDOCNmlTZwb9Rt_yosRn66bNQzkO67N"
    dns: "1VrAUrGGpmJXYWpIG9P8XiZolsQo0Ty6A"
    redteam: "1rNNuvN7Fzg3WFAs1Sdys9tw8Nj8pfQD1"
  missing_value: "?"

seed: 0

# Label groups (README section 4).
labels:
  # Rows added to the possible red-team group by hand (README section 4.2).
  possible_exceptions: [897415494]

# day_index = floor((time - 1) / 86400) + 1
splits:
  warmup: [1, 7]
  train: [8, 30]
  validation: [31, 42]
  test: [43, 58]

features:
  windows_seconds: [300, 3600, 86400]

# DNS collection changes scale at day 27 (README section 6, DNS coverage audit).
dns:
  full_collection_from_day: 27

sampling:
  unlabeled_cap: 1000000
  stratify_by: day
  compare_weighted_unweighted: true

outages:
  durations_seconds: [300, 3600, 21600]
  scenarios: [global, source_subset, longer_than_training]
  seeds: [0, 1, 2, 3, 4]
  heldout: []  # set at least one duration or source-subset condition

evaluation:
  daily_review_budgets: [100, 500, 1000]
  recall_unit: unique_redteam_key
