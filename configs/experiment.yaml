# KnightGlass experiment configuration.
# Values are the provisional defaults from the README. Change them only with
# training/validation evidence, and record every change.

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  files:
    auth: auth.txt.gz
    dns: dns.txt.gz
    redteam: redteam.txt.gz
  # Google Drive file IDs for gdown (files shared as "Anyone with the link").
  drive_ids:
    auth: "1PjDOCNmlTZwb9Rt_yosRn66bNQzkO67N"
    dns: "1VrAUrGGpmJXYWpIG9P8XiZolsQo0Ty6A"
    redteam: "1rNNuvN7Fzg3WFAs1Sdys9tw8Nj8pfQD1"
  missing_value: "?"

seed: 0

# Label groups (README section 4).
labels:
  # Rows added to the possible red-team group by hand (README section 4.2).
  possible_exceptions: [897415494]

# day_index = floor((time - 1) / 86400) + 1
# Locked from label coverage (README section 5.3).
splits:
  warmup: [1, 5]
  train: [6, 12]
  validation: [13, 20]
  test: [21, 30]
  alert_volume: [31, 58]
# Final models are refit on these days with settings chosen on validation.
refit_days: [6, 20]

features:
  windows_seconds: [300, 3600, 86400]

# DNS collection changes scale at day 27 (README section 6, DNS coverage audit).
dns:
  full_collection_from_day: 27

sampling:
  unlabeled_cap: 1000000
  stratify_by: day
  compare_weighted_unweighted: true

outages:
  durations_seconds: [300, 3600, 21600]
  scenarios: [global, source_subset, longer_than_training]
  seeds: [0, 1, 2, 3, 4]
  heldout: []  # set at least one duration or source-subset condition

# Baseline settings grid (README section 8). Each model is fit on the
# training sample for every combination, the best is chosen on validation by
# mean recall across evaluation.daily_review_budgets, then refit on
# refit_days and scored on test once.
models:
  logistic:
    - {C: 0.01}
    - {C: 1.0}
  # l2_regularization keeps leaf values finite at this class imbalance; without
  # it the boosting diverged (training AUC 0.58, scores saturated at 0 and 1).
  hist_gb:
    - {learning_rate: 0.1, max_leaf_nodes: 31, max_iter: 100, l2_regularization: 1.0}
    - {learning_rate: 0.05, max_leaf_nodes: 63, max_iter: 100, l2_regularization: 1.0}
  weighting: [unweighted, inclusion]

evaluation:
  daily_review_budgets: [100, 500, 1000]
  recall_unit: unique_redteam_key
